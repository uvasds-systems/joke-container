name: Publish

# runs only after "Test" completes (pushes to main and pull requests)
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

env:
  GHCR_PAT: ${{ secrets.GHCR_PAT }}

jobs:
  publish:
    # publish only if the tests passed, and never for PRs from forks
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR image names must be lowercase.
      # main gets latest + run number; PRs get pr-<number> only, so they never move latest.
      - name: Set image tags
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/joke-container"
          if [ "$EVENT" = "pull_request" ]; then
            [ -n "$PR_NUMBER" ] || { echo "::error::No PR number on triggering run"; exit 1; }
            tags="$image:pr-$PR_NUMBER"
          elif [ "$BRANCH" = "main" ]; then
            tags="$image:latest,$image:$GITHUB_RUN_NUMBER"
          else
            echo "::error::Refusing to publish from branch '$BRANCH'"; exit 1
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_PAT }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
